spring:
  application:
    name: taskly-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskly}
    username: ${DB_USER:taskly}
    password: ${DB_PASSWORD:taskly}

  jpa:
    # O schema é responsabilidade do Flyway; o Hibernate só valida o mapeamento.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

taskly:
  jwt:
    # O valor padrão serve só para desenvolvimento local; em produção defina JWT_SECRET.
    secret: ${JWT_SECRET:taskly-segredo-de-desenvolvimento-nao-usar-em-producao}
    access-token-validade: ${JWT_ACCESS_VALIDADE:15m}
    refresh-token-validade: ${JWT_REFRESH_VALIDADE:7d}
  admin:
    # Se definidos, criam o primeiro ADMIN na subida (quando ainda não existe nenhum).
    email: ${TASKLY_ADMIN_EMAIL:}
    senha: ${TASKLY_ADMIN_SENHA:}
  horas:
    # Máximo que uma pessoa pode apontar num mesmo dia, somando todas as tarefas.
    limite-diario: ${TASKLY_HORAS_LIMITE_DIARIO:12h}
    # Fuso usado para saber que dia é "hoje" (não se apontam horas no futuro).
    fuso: ${TASKLY_FUSO:America/Sao_Paulo}

management:
  endpoints:
    web:
      exposure:
        include: health,info
