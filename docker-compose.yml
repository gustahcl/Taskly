services:
  postgres:
    image: postgres:16-alpine
    container_name: taskly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-taskly}
      POSTGRES_USER: ${DB_USER:-taskly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - taskly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-taskly} -d ${DB_NAME:-taskly}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  taskly-pgdata:
